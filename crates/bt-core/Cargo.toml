[package]
name = "bt-core"
version = "0.1.0"
edition = "2021"
description = "Core BehaviorTree parser, AST, model scanner and validator in Rust"

[dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.17"
